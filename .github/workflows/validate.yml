name: Validate foundation

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.11"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python modules
        run: python -m py_compile sq_dev_aigent/__init__.py sq_dev_aigent/core.py sq_dev_aigent/cli.py sq_dev_aigent/systems.py sq_dev_aigent/workflow.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate 100-skill catalog
        run: python -c "import json; d=json.load(open('skills/catalog.json')); ids=[x['id'] for x in d]; assert len(d)==100 and len(set(ids))==100"
      - name: Check installer syntax
        run: sh -n install.sh
      - name: Installer smoke test
        run: sh tests/test_installer.sh
